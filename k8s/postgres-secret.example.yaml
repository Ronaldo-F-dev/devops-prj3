# Modele, sans valeur reelle. Ce fichier documente la structure attendue,
# il n'est jamais applique tel quel.
#
# Le vrai Secret est cree directement sur le cluster (kubectl create secret,
# ou copie depuis les valeurs deja utilisees par le deploiement Docker Compose
# du Projet 4) -- jamais ecrit en clair dans un fichier versionne.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: kps-tasks
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
