name: CI

on:
  push:
    branches:
      - main
      - feature/**
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r requirements.txt
          pip install --only-binary :all: ruff

      - run: ruff check app --fix
  test:
    runs-on: ubuntu-latest

    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r requirements.txt
          pip install --only-binary :all: pytest httpx

      - run: pytest
  docker_build:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/kps-tasks-api"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          COMMIT_TAG="$IMAGE:commit-${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "commit_tag=$COMMIT_TAG" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version_tag=$IMAGE:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.tags.outputs.commit_tag }}" .
          if [ -n "${{ steps.tags.outputs.version_tag }}" ]; then
            docker tag "${{ steps.tags.outputs.commit_tag }}" "${{ steps.tags.outputs.version_tag }}"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "${{ steps.tags.outputs.commit_tag }}"
          if [ -n "${{ steps.tags.outputs.version_tag }}" ]; then
            docker push "${{ steps.tags.outputs.version_tag }}"
          fi

      - name: Verify image is available in the registry
        run: |
          docker manifest inspect "${{ steps.tags.outputs.commit_tag }}" > /dev/null
          echo "Image available: ${{ steps.tags.outputs.commit_tag }}"

  secret_scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest

    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r requirements.txt

      - run: pytest --cov=app --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io