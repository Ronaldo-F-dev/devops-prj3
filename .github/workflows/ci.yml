name: CI

on:
  push:
    branches:
      - main
      - feature/**
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r requirements.txt
          pip install --only-binary :all: ruff

      - run: ruff check app --fix
  test:
    runs-on: ubuntu-latest

    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r requirements.txt
          pip install --only-binary :all: pytest httpx

      - run: pytest
  docker_build:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    needs: test

    permissions:
      contents: read
      packages: write

    outputs:
      commit_tag: ${{ steps.tags.outputs.commit_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/kps-tasks-api"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          COMMIT_TAG="$IMAGE:commit-${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "commit_tag=$COMMIT_TAG" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version_tag=$IMAGE:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.tags.outputs.commit_tag }}" .
          if [ -n "${{ steps.tags.outputs.version_tag }}" ]; then
            docker tag "${{ steps.tags.outputs.commit_tag }}" "${{ steps.tags.outputs.version_tag }}"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "${{ steps.tags.outputs.commit_tag }}"
          if [ -n "${{ steps.tags.outputs.version_tag }}" ]; then
            docker push "${{ steps.tags.outputs.version_tag }}"
          fi

      - name: Verify image is available in the registry
        run: |
          docker manifest inspect "${{ steps.tags.outputs.commit_tag }}" > /dev/null
          echo "Image available: ${{ steps.tags.outputs.commit_tag }}"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs: docker_build

    if: github.ref == 'refs/heads/main'

    environment: production

    # Deployments must never race: if a newer commit's deploy job is created
    # (running or waiting for approval), any older one for the same
    # environment is cancelled instead of running later and overwriting the
    # newer state (see docs/prj4/incident-report.md, incident 4).
    concurrency:
      group: production-deploy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deployment files
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml scripts/deploy.sh scripts/healthcheck.sh scripts/rollback.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/kps-tasks-api/"

      - name: Run deployment
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            cd /opt/kps-tasks-api &&
            chmod +x deploy.sh healthcheck.sh rollback.sh &&
            IMAGE_TAG='${{ needs.docker_build.outputs.commit_tag }}' \
            REGISTRY_URL='${{ secrets.REGISTRY_URL }}' \
            REGISTRY_USER='${{ secrets.REGISTRY_USER }}' \
            REGISTRY_PASSWORD='${{ secrets.REGISTRY_PASSWORD }}' \
            ./deploy.sh
          "

  secret_scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest

    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r requirements.txt

      - run: pytest --cov=app --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io